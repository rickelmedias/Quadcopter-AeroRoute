# Host (PC) environment for the bench build and checks.
#   conda env create -f environment.yml
#   conda env update -f environment.yml --prune
# Only conda-forge is used. If conda complains about the Anaconda channels' Terms of
# Service, run: conda config --remove channels defaults
name: aeroroute
channels:
  - conda-forge
dependencies:
  - python=3.12
  - clang-format=19
  - cppcheck
  - ruff
  - pyserial
  - numpy
  - scipy
