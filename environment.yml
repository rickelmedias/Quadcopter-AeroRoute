# Host (PC) environment. The Raspberry Pi keeps its own venv (rpi/tools/pi/requirements.txt).
#   conda env create -f environment.yml
#   conda env update -f environment.yml --prune
# Only conda-forge is used. If conda complains about the Anaconda channels' Terms of
# Service, run: conda config --remove channels defaults
name: aeroroute
channels:
  - conda-forge
dependencies:
  - python=3.12
  - clang-format=19
  - cppcheck
  - ruff
  - numpy
  - scipy
  - matplotlib
  - pyserial
  - pip
  - pip:
      - pymavlink>=2.4.40
      - control
